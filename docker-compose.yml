services:

  postgres:
    image: postgres:16
    container_name: project_manager_postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: Interns_Project1_FastAPI

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data


  backend:
    build:
      context: ./backend

    container_name: project_manager_backend
    restart: unless-stopped

    depends_on:
      - postgres

    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/Interns_Project1_FastAPI
      JWT_SECRET: change-this-in-production
      JWT_ALGORITHM: HS256
      OPENAI_API_KEY: ${OPENAI_API_KEY}

    ports:
      - "8000:8000"


  frontend:
    build:
      context: ./frontend

    container_name: project_manager_frontend
    restart: unless-stopped

    depends_on:
      - backend

    ports:
      - "3000:3000"


volumes:
  postgres_data: